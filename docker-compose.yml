services:
  mud:
    build: .
    container_name: quickmud-server
    ports:
      - "${PORT:-5001}:${PORT:-5001}"
    env_file:
      - .env
    environment:
      - LANGUAGE=${LANGUAGE:-zh}
    volumes:
      - .:/app
    working_dir: /app
    command: mud runserver
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(5); s.connect(('localhost', int('${PORT:-5001}'))); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  websocket:
    build: .
    container_name: quickmud-websocket
    ports:
      - "${WS_PORT:-8000}:${WS_PORT:-8000}"
    env_file:
      - .env
    environment:
      - LANGUAGE=${LANGUAGE:-zh}
      - PORT=${WS_PORT:-8000}
    volumes:
      - .:/app
    working_dir: /app
    command: mud websocketserver --port ${WS_PORT:-8000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(5); s.connect(('localhost', int('${WS_PORT:-8000}'))); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
