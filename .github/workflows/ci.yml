name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          pytest tests/ -x --timeout=120

      - name: Run i18n coverage check
        run: |
          python scripts/i18n_coverage.py --threshold 95

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Enforce rng_mm usage
        run: |
          if grep -R -n "\brandom\." mud/combat mud/affects; then
            echo "Forbidden Python random.* usage found in combat/affects." >&2
            exit 1
          else
            echo "OK: no random.* usage in combat/affects"
          fi

      - name: Test fixtures lint
        run: |
          python3 scripts/lint_test_fixtures.py
